<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Practice the most common words with spaced-repetition flashcards.">
    <title data-i18n="nav.flashcards">Flashcards · SQWease</title>
    <link rel="stylesheet" href="assets/theme.css">
    <script src="assets/theme.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .flashcards-wrap {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .flashcards-wrap .nav { align-self: flex-start; margin-bottom: 20px; }
        .nav {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .nav a {
            color: var(--primary);
            font-weight: 600;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
        }
        h1 { color: var(--primary); margin: 0 0 4px; text-align: center; }
        .subtitle { color: var(--secondary-text); margin: 0 0 24px; }
        .deck-stats {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 32px;
            box-shadow: var(--shadow);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .deck-stats h2 { font-size: 1.5rem; margin-bottom: 24px; color: var(--text); }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        .stat-row:last-child { border-bottom: none; }
        .stat-label { color: var(--secondary-text); }
        .stat-value { font-weight: 700; font-size: 1.1rem; }
        .stat-value.new { color: #3d3cc9; }
        .stat-value.learning { color: #c0392b; }
        .stat-value.review { color: #1e8449; }
        [data-theme="dark"] .stat-value.new { color: #9d9cff; }
        [data-theme="dark"] .stat-value.learning { color: #ff8a80; }
        [data-theme="dark"] .stat-value.review { color: #5ddc8a; }
        .study-btn {
            margin-top: 24px;
            width: 100%;
            padding: 16px 24px;
            min-height: 44px;
            background: #3d3cc9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .study-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(61, 60, 201, 0.4); }
        .study-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; transform: none; }
        .display-phase { font-size: 0.9rem; margin: 12px 0 8px; display: flex; align-items: center; gap: 8px; justify-content: center; }
        .display-phase label { color: var(--secondary-text); font-weight: 600; }
        .select-primary {
            padding: 8px 14px;
            min-height: 44px;
            border: 2px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        .hidden { display: none !important; }
        .container {
            perspective: 1000px;
            width: 100%;
            min-width: 280px;
            max-width: 500px;
            height: clamp(240px, 60vh, 400px);
            cursor: pointer;
        }
        .container:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 15px; }
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            border-radius: 15px;
            background: var(--card-bg);
        }
        .card.is-flipped { transform: rotateY(180deg); }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            overflow-y: auto;
        }
        .card-front { background-color: var(--card-bg); border: 2px solid var(--primary); }
        .card-back { background-color: var(--card-bg); transform: rotateY(180deg); border: 2px solid #1e8449; }
        .word { font-size: clamp(2.2rem, 12vw, 5rem); margin: 0; color: var(--text); overflow-wrap: anywhere; }
        .pronunciation { font-size: 1.5rem; color: var(--secondary-text); margin-top: 10px; font-style: italic; overflow-wrap: anywhere; }
        .definition { font-size: 1.5rem; font-weight: bold; color: var(--primary); margin: 20px 0 10px; }
        .sentence { font-size: 1.1rem; margin-top: 15px; color: var(--secondary-text); line-height: 1.6; }
        .rating-buttons { margin-top: 30px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .rating-btn {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            padding: 12px 20px; min-height: 44px; border: none; border-radius: 8px;
            font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; min-width: 90px;
        }
        .rating-btn:hover { transform: translateY(-2px); }
        .rating-btn .interval { font-size: 0.85rem; opacity: 0.95; }
        .rating-btn.again { background: #c0392b; color: white; }
        .rating-btn.hard { background: #a15c00; color: white; }
        .rating-btn.good { background: #1e8449; color: white; }
        .rating-btn.easy { background: #3d3cc9; color: white; }
        .progress { margin-top: 20px; color: var(--secondary-text); font-size: 0.9rem; }
        .nav-controls { display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 20px; }
        .nav-btn {
            background: var(--card-bg); border: 2px solid var(--border); color: var(--text);
            padding: 8px 16px; min-height: 44px; border-radius: 8px; font-size: 1.2rem; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .nav-btn:hover { transform: scale(1.05); box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15); }
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .instruction { font-size: 0.8rem; color: var(--muted); margin-top: 10px; }
        @media (max-width: 600px) {
            body { padding: 12px; }
            h1 { font-size: 1.5rem; }
            .word { font-size: clamp(2rem, 14vw, 3rem); }
            .pronunciation { font-size: 1.2rem; }
            .definition { font-size: 1.2rem; }
            .sentence { font-size: 0.95rem; }
            .rating-buttons { gap: 8px; margin-top: 16px; }
            .rating-btn { min-width: 70px; padding: 10px 14px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <button type="button" class="theme-toggle" aria-label="Toggle dark mode" aria-pressed="false" data-i18n-attr="aria-label:a11y.themeToggle">
        <span class="icon-light" aria-hidden="true">🌙</span>
        <span class="icon-dark" aria-hidden="true">☀️</span>
    </button>
    <main class="flashcards-wrap">
    <nav class="nav" aria-label="Breadcrumb">
        <a href="index.html" data-i18n="common.menu">← Menu</a>
    </nav>
    <h1 data-i18n="nav.flashcards">Flashcards</h1>
    <p class="subtitle" id="deckSubtitle"></p>

    <div id="deckView" class="deck-stats">
        <h2 id="deckTitle">…</h2>
        <div class="stat-row">
            <span class="stat-label" data-i18n="fc.new">New</span>
            <span class="stat-value new" id="statNew">0</span>
        </div>
        <div class="stat-row">
            <span class="stat-label" data-i18n="fc.learning">Learning</span>
            <span class="stat-value learning" id="statLearning">0</span>
        </div>
        <div class="stat-row">
            <span class="stat-label" data-i18n="fc.review">To Review</span>
            <span class="stat-value review" id="statReview">0</span>
        </div>
        <p class="display-phase">
            <label for="romajiPhase" data-i18n="fc.display">Display:</label>
            <select id="romajiPhase" class="select-primary" aria-label="Display phase">
                <option value="1" data-i18n="fc.phase1">Phase 1 (romaji + definition)</option>
                <option value="2" data-i18n="fc.phase2">Phase 2 (no romaji)</option>
                <option value="3" data-i18n="fc.phase3">Phase 3 (word only)</option>
            </select>
        </p>
        <p id="noCardsMessage" class="hidden" role="status" aria-live="polite"></p>
        <button class="study-btn" id="studyBtn" data-i18n="fc.studyNow">Study Now</button>
    </div>

    <div id="reviewView" class="hidden">
    <div class="container" id="cardContainer" role="button" tabindex="0" aria-pressed="false"
         data-i18n-attr="aria-label:a11y.flipCard" aria-label="Flashcard. Activate to flip and reveal the answer.">
        <div class="card" id="card">
            <div class="card-face card-front">
                <h2 class="word" id="word">…</h2>
                <div class="instruction" data-i18n="fc.tapToFlip">(Tap or press Space to flip)</div>
            </div>
            <div class="card-face card-back">
                <div class="pronunciation" id="pronunciation"></div>
                <div class="definition" id="definition"></div>
                <div class="sentence" id="sentence"></div>
            </div>
        </div>
    </div>
    <div class="rating-buttons hidden" id="ratingButtons">
        <button class="rating-btn again" id="btnAgain">
            <span data-i18n="fc.again">Again</span>
            <span class="interval" id="intervalAgain">&lt;1m</span>
        </button>
        <button class="rating-btn hard" id="btnHard">
            <span data-i18n="fc.hard">Hard</span>
            <span class="interval" id="intervalHard">&lt;10m</span>
        </button>
        <button class="rating-btn good" id="btnGood">
            <span data-i18n="fc.good">Good</span>
            <span class="interval" id="intervalGood">1d</span>
        </button>
        <button class="rating-btn easy" id="btnEasy">
            <span data-i18n="fc.easy">Easy</span>
            <span class="interval" id="intervalEasy">4d</span>
        </button>
    </div>
    <div class="nav-controls">
        <button type="button" class="nav-btn" id="navPrev" aria-label="Previous card">←</button>
        <div class="progress" id="progress" role="status" aria-live="polite">Loading…</div>
        <button type="button" class="nav-btn" id="navNext" aria-label="Next card">→</button>
    </div>
    </div>
    </main>

    <script src="assets/store.js"></script>
    <script src="assets/i18n.js"></script>
    <script src="assets/langs.js"></script>
    <script src="assets/vocab.js"></script>
    <script src="romaji.js" defer></script>
    <script src="srs.js" defer></script>
    <script src="syllable-color.js" defer></script>
    <script defer>
    (function () {
        'use strict';

        var vocabulary = [];
        var srsCards = {};
        var dueCards = [];
        var currentIndex = 0;
        var isFlipped = false;
        var newCardsPerDay = 20;
        var newCardsIntroduced = 0;
        var activeTarget = 'ja';

        var card = document.getElementById('card');
        var cardContainer = document.getElementById('cardContainer');
        var wordEl = document.getElementById('word');
        var pronunciationEl = document.getElementById('pronunciation');
        var definitionEl = document.getElementById('definition');
        var sentenceEl = document.getElementById('sentence');
        var progressEl = document.getElementById('progress');

        var FALLBACK_VOCAB = [
            { id: 'ja-f1', w: "の", p: "no (noh)", d: "possessive (like 's)", s: "私の本です。 (It's my book.)" },
            { id: 'ja-f2', w: "に", p: "ni (nee)", d: "to; at; in", s: "学校に行きます。 (I go to school.)" },
            { id: 'ja-f3', w: "は", p: "wa (wah)", d: "topic marker", s: "私は学生です。 (I am a student.)" },
            { id: 'ja-f4', w: "を", p: "wo (oh)", d: "object marker", s: "水を飲みます。 (I drink water.)" },
            { id: 'ja-f5', w: "が", p: "ga (gah)", d: "subject marker", s: "猫がいます。 (There is a cat.)" }
        ];

        var SRS_KEY = 'sqwease-flashcards-srs';
        var SRS_DATE_KEY = 'sqwease-flashcards-date';
        var SRS_NEW_KEY = 'sqwease-flashcards-new-today';
        var ROMAJI_PHASE_KEY = 'sqwease-romaji-phase';

        function todayKey() { return new Date().toISOString().slice(0, 10); }

        function getRomajiPhase() {
            var n = SqweaseStore.getInt(ROMAJI_PHASE_KEY, 1);
            return (n === 1 || n === 2 || n === 3) ? n : 1;
        }
        function setRomajiPhase(phase) { SqweaseStore.setString(ROMAJI_PHASE_KEY, String(phase)); }

        function saveSRS() {
            SqweaseStore.set(SRS_KEY, srsCards);
            SqweaseStore.setString(SRS_DATE_KEY, todayKey());
            SqweaseStore.setString(SRS_NEW_KEY, String(newCardsIntroduced));
        }

        function loadSRS() {
            srsCards = SqweaseStore.get(SRS_KEY, {}) || {};
            if (SqweaseStore.getString(SRS_DATE_KEY, '') === todayKey()) {
                newCardsIntroduced = SqweaseStore.getInt(SRS_NEW_KEY, 0);
            } else {
                newCardsIntroduced = 0;
            }
        }

        function getOrInitCard(itemId) {
            if (!srsCards[itemId]) srsCards[itemId] = SRS.initCard(itemId);
            return srsCards[itemId];
        }

        function updateStats() {
            var newCount = 0, learningCount = 0, reviewCount = 0;
            for (var i = 0; i < vocabulary.length; i++) {
                var srsCard = srsCards[vocabulary[i].id];
                if (!srsCard) newCount++;
                else if (srsCard.state === 'learning' && SRS.isDue(srsCard)) learningCount++;
                else if (srsCard.state === 'review' && SRS.isDue(srsCard)) reviewCount++;
            }
            document.getElementById('statNew').textContent = newCount;
            document.getElementById('statLearning').textContent = learningCount;
            document.getElementById('statReview').textContent = reviewCount;
            document.getElementById('studyBtn').disabled = (newCount + learningCount + reviewCount) === 0;
            var noCardsEl = document.getElementById('noCardsMessage');
            if (noCardsEl) { noCardsEl.classList.add('hidden'); noCardsEl.textContent = ''; }
        }

        function buildDueQueue() {
            dueCards = [];
            var learning = [], review = [], fresh = [];
            for (var i = 0; i < vocabulary.length; i++) {
                var srsCard = srsCards[vocabulary[i].id];
                if (!srsCard) { if (newCardsIntroduced < newCardsPerDay) fresh.push(i); }
                else if (srsCard.state === 'learning' && SRS.isDue(srsCard)) learning.push(i);
                else if (srsCard.state === 'review' && SRS.isDue(srsCard)) review.push(i);
            }
            dueCards = review.concat(learning).concat(fresh);
        }

        function startStudy() {
            buildDueQueue();
            var noCardsEl = document.getElementById('noCardsMessage');
            if (dueCards.length === 0) {
                if (noCardsEl) {
                    noCardsEl.textContent = SqweaseI18n.t('fc.noCardsDue');
                    noCardsEl.classList.remove('hidden');
                }
                return;
            }
            if (noCardsEl) noCardsEl.classList.add('hidden');
            currentIndex = 0;
            document.getElementById('deckView').classList.add('hidden');
            document.getElementById('reviewView').classList.remove('hidden');
            showCard();
        }

        function renderCardFaces(item) {
            if (activeTarget === 'ja' && item.tokens && typeof SyllableColor !== 'undefined' && SyllableColor.colorizeByTokens) {
                var c1 = SyllableColor.colorizeByTokens(item.w, item.tokens, SyllableColor.isDarkTheme());
                wordEl.innerHTML = c1.jaHtml; pronunciationEl.innerHTML = c1.romajiHtml; definitionEl.innerHTML = c1.enHtml;
            } else if (activeTarget === 'ja' && typeof SyllableColor !== 'undefined' && SyllableColor.colorizeByWords) {
                var c2 = SyllableColor.colorizeByWords(item.w, item.p, item.d, SyllableColor.isDarkTheme());
                wordEl.innerHTML = c2.jaHtml; pronunciationEl.innerHTML = c2.romajiHtml; definitionEl.innerHTML = c2.enHtml;
            } else {
                wordEl.textContent = item.w;
                pronunciationEl.textContent = item.p || '';
                definitionEl.textContent = item.d || '';
            }
        }

        function showCard() {
            if (currentIndex >= dueCards.length) {
                document.getElementById('deckView').classList.remove('hidden');
                document.getElementById('reviewView').classList.add('hidden');
                updateStats();
                return;
            }
            var item = vocabulary[dueCards[currentIndex]];
            var srsCard = getOrInitCard(item.id);
            if (srsCard.state === 'new') { newCardsIntroduced++; saveSRS(); }

            cardContainer.setAttribute('lang', activeTarget);
            sentenceEl.innerHTML = (item.s || '').replace(/\n/g, '<br>');
            renderCardFaces(item);

            document.getElementById('intervalAgain').textContent = SRS.getIntervalDisplay(srsCard, 1);
            document.getElementById('intervalHard').textContent = SRS.getIntervalDisplay(srsCard, 2);
            document.getElementById('intervalGood').textContent = SRS.getIntervalDisplay(srsCard, 3);
            document.getElementById('intervalEasy').textContent = SRS.getIntervalDisplay(srsCard, 4);

            card.classList.remove('is-flipped');
            isFlipped = false;
            cardContainer.setAttribute('aria-pressed', 'false');
            document.getElementById('ratingButtons').classList.add('hidden');
            progressEl.textContent = SqweaseI18n.t('fc.cardOf', { n: currentIndex + 1, total: dueCards.length });
            updateNavButtons();
        }

        function flipCard() {
            if (dueCards.length === 0) return;
            card.classList.toggle('is-flipped');
            isFlipped = !isFlipped;
            cardContainer.setAttribute('aria-pressed', isFlipped ? 'true' : 'false');
            document.getElementById('ratingButtons').classList.toggle('hidden', !isFlipped);
        }

        function rateCard(rating) {
            var item = vocabulary[dueCards[currentIndex]];
            var updated = SRS.reviewCard(getOrInitCard(item.id), rating);
            srsCards[item.id] = updated;
            saveSRS();
            currentIndex++;
            showCard();
        }

        function navigatePrev() { if (currentIndex > 0) { currentIndex--; showCard(); } }
        function navigateNext() { if (currentIndex < dueCards.length - 1) { currentIndex++; showCard(); } }

        function updateNavButtons() {
            document.getElementById('navPrev').disabled = currentIndex <= 0;
            document.getElementById('navNext').disabled = currentIndex >= dueCards.length - 1;
        }

        function setDeckLabels() {
            var lang = SqweaseLangs.getActiveLang();
            var name = lang ? lang.nativeName : 'Japanese';
            var count = vocabulary.length;
            document.getElementById('deckTitle').textContent = SqweaseI18n.t('fc.title', { lang: name, count: count });
            document.getElementById('deckSubtitle').textContent = lang ? (lang.nativeName + ' · ' + lang.name) : '';
            document.getElementById('deckSubtitle').setAttribute('lang', activeTarget);
        }

        function initVocab() {
            activeTarget = SqweaseLangs.getActive();
            progressEl.textContent = SqweaseI18n.t('fc.loading');
            SqweaseVocab.load(activeTarget).then(function (deck) {
                vocabulary = (deck && deck.words && deck.words.length) ? deck.words : FALLBACK_VOCAB;
                setDeckLabels();
                loadSRS();
                updateStats();
                progressEl.textContent = SqweaseI18n.t('fc.ready');
                updateNavButtons();
            }).catch(function () {
                vocabulary = FALLBACK_VOCAB;
                activeTarget = 'ja';
                setDeckLabels();
                loadSRS();
                updateStats();
                progressEl.textContent = SqweaseI18n.t('err.noData', { lang: SqweaseLangs.getActiveLang().name });
            });
        }

        function bind() {
            cardContainer.addEventListener('click', flipCard);
            cardContainer.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.code === 'Space') { e.preventDefault(); e.stopPropagation(); flipCard(); }
            });
            document.getElementById('studyBtn').addEventListener('click', startStudy);
            document.getElementById('btnAgain').addEventListener('click', function () { rateCard(1); });
            document.getElementById('btnHard').addEventListener('click', function () { rateCard(2); });
            document.getElementById('btnGood').addEventListener('click', function () { rateCard(3); });
            document.getElementById('btnEasy').addEventListener('click', function () { rateCard(4); });
            document.getElementById('navPrev').addEventListener('click', navigatePrev);
            document.getElementById('navNext').addEventListener('click', navigateNext);

            document.addEventListener('keydown', function (e) {
                if (dueCards.length === 0) return;
                if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown') {
                    e.preventDefault(); flipCard();
                } else if (isFlipped) {
                    if (e.code === 'Digit1') rateCard(1);
                    else if (e.code === 'Digit2') rateCard(2);
                    else if (e.code === 'Digit3') rateCard(3);
                    else if (e.code === 'Digit4') rateCard(4);
                } else if (e.code === 'ArrowLeft') navigatePrev();
                else if (e.code === 'ArrowRight') navigateNext();
            });

            var phaseEl = document.getElementById('romajiPhase');
            phaseEl.value = String(getRomajiPhase());
            phaseEl.addEventListener('change', function () {
                setRomajiPhase(parseInt(phaseEl.value, 10));
                if (dueCards.length) showCard();
            });

            document.addEventListener('sqwease:localechange', function () {
                SqweaseI18n.apply();
                setDeckLabels();
                if (dueCards.length) progressEl.textContent = SqweaseI18n.t('fc.cardOf', { n: currentIndex + 1, total: dueCards.length });
            });
        }

        document.addEventListener('DOMContentLoaded', function () {
            bind();
            initVocab();
        });
    })();
    </script>
</body>
</html>
